<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia — CodeMon Adventure</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 32px; background: Canvas; color: CanvasText; }
    main { max-width: 1100px; margin: 0 auto; }
    img { display: block; width: 100%; height: auto; border-radius: 14px; }
    p { line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>CodeMon Adventure</h1>
    <p>A animação dura 38 segundos e contém dois encontros.</p>
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="assets/github-rpg-dark.svg">
      <img src="assets/github-rpg.svg" alt="Mapa RPG animado do GitHub">
    </picture>
  </main>
</body>
</html>
